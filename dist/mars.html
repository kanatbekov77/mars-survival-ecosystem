.flag { color: var(--warn); } .truth { color: var(--ok); }

  'beep.1': 'A sol is a day on Mars, about 40 minutes longer than on Earth. Open “Oxygen”.',
  'beep.2': 'Radish is a chance for a second harvest. An empty tray saves water and nutrients.',
  'beep.3': 'If pressure drops, check with a reading first. Then isolate and repair.',
  'beep.4': 'The message travels at light speed, but the distance is huge. The reply comes in the morning.',
  'beep.5': 'Electrolysis makes O₂ from water. The scrubber removes CO₂. They are different machines.',
  'beep.6': 'Grey water is purified during the day. Without power, recycling waits.',

  'beep.10': 'Light is back but power is lower? Then the panels are dirty.',
  'beep.11': 'There is oxygen in the tank. Let’s see what builds up in the air.',

  'beep.14': 'Lettuce ripens in 32 effective sols. Every dark hour delays it.',
  'beep.15': 'Water is going down the drain. Replace the cassette or cut use.',

  'card.title': 'Science card', 'card.open': 'Science card', 'card.label': 'Label', 'card.sources': 'Sources', 'card.gameNote': 'Game setpoints and model numbers are scenario assumptions.',

  'acq.bundled': 'archive, bundled snapshot', 'acq.cache': 'cache', 'acq.fetched': 'fetched (UTC)', 'acq.synthetic': 'synthetic example',
  'card.C01.t': 'Sol and atmosphere', 'card.C01.b': 'A sol is about 40 minutes (39 min 35 s) longer than an Earth day. The Martian atmosphere is thin and mostly CO₂.',
  'card.C03.t': 'Pressure', 'card.C03.b': 'When a module leaks, a mix of gases escapes. To know whether there is enough oxygen, we look at its partial pressure.',
  'card.C05.t': 'Two air paths', 'card.C05.b': 'Electrolysis splits water into oxygen and hydrogen. A scrubber removes carbon dioxide from the air.',
  'card.C06.t': 'The water cycle', 'card.C06.b': 'Part of the used water, including moisture from the air, can be collected and purified. This needs equipment and energy.',
  'card.C08.t': 'Dust', 'card.C08.b': 'Dust in the air blocks light. Dust on panels keeps them from collecting light even after the sky clears. In 2018 a storm ended the Opportunity rover’s mission.',
